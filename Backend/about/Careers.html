<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers & Internships | windguard IT Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/other.css">
    <link rel="icon" type="image/png" href="../img/tab_icon.png">
    <script src="../js/careers.js" defer></script>
    <style>
        :root {
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --dark-blue: #0a192f;
            --text-main: #2d3748;
            --text-muted: #718096;
            --bg-body: #f7fafc;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .page-hero {
            position: relative;
            background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
            color: white;
            padding: 5rem 2rem;
            text-align: center;
        }
        .page-hero-container h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        .page-hero-container p {
            font-size: 1.1rem;
            color: #8892b0;
            max-width: 600px;
            margin: 0 auto;
        }
        .careers-wrapper {
            max-width: 900px;
            margin: -3rem auto 5rem auto;
            position: relative;
            z-index: 10;
            padding: 0 1.5rem;
        }
        .careers-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
            padding: 3.5rem;
        }
        .form-header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }
        .form-header h2 {
            font-size: 1.8rem;
            color: var(--dark-blue);
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }
        .form-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }
        .full-width {
            grid-column: span 2;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 0.6rem;
            font-size: 0.88rem;
            color: var(--dark-blue);
        }
        .form-group input, 
        .form-group select, 
        .form-group textarea {
            padding: 0.85rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #f8fafc;
            font-family: inherit;
            transition: all 0.2s ease-in-out;
        }
        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }
        .file-note {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-submit {
            width: 100%;
            padding: 1.1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
        }
        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 102, 204, 0.3);
        }
        .btn-submit:disabled {
            background: #cbd5e0;
            color: #718096;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .status-msg {
            text-align: center;
            margin-top: 1.5rem;
            font-weight: 500;
            display: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .status-msg.success {
            display: block;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .status-msg.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .careers-card { padding: 2rem 1.5rem; }
            .careers-wrapper { margin-top: -1.5rem; }
        }
    </style>
</head>
<body>
<header id="dynamicHeader"></header>
<section class="page-hero" id="dynamicHero"></section>
<main class="careers-wrapper">
    <div class="careers-card">
        <div class="form-header" id="dynamicFormTitle"></div>
        <form id="internshipForm">
            <div class="form-grid" id="dynamicFormFields">
                </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                Submit Application <i class="fas fa-arrow-right"></i>
            </button>
            <div id="statusMessage" class="status-msg"></div>
        </form>
    </div>
</main>
<footer id="dynamicFooter"></footer>
</body>
</html>
